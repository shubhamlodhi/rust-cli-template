[package]
name = "{{cli_name}}"
version = "0.1.0"
edition = "2021"
authors = ["{{author_name}} <{{author_email}}>"]
description = "{{project_description}}"
readme = "README.md"
license = "MIT"
{% if github_username != "" %}
repository = "https://github.com/{{github_username}}/{{cli_name}}"
{% endif %}

[dependencies]
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
{% if use_config %}
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
{% endif %}

[[bin]]
name = "{{cli_name}}"
path = "src/main.rs"
